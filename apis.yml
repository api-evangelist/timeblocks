aid: timeblocks
name: TimeBlocks
description: >-
  TimeBlocks is a consumer calendar and personal scheduling mobile app developed by Day2Life Inc.,
  a South Korean company backed by 500 Global. Marketed as Korea's #1 decoration calendar, it brings
  calendar, to-do, memo, and habit tracking together in a single view, with patented drag-and-drop
  time-block scheduling (US Patent 10,409,474 B2), roughly 1,000 customization items (themes, stickers,
  fonts), shared and group calendars with real-time notifications, seven home-screen widgets, and
  cloud sync across devices. It is a native iOS and Android app; as of this enrichment pass it
  publishes no public developer API, SDK, or API documentation surface.
